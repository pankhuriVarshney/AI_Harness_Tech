<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Michelin Converge — Agentic Lead-to-Dealer Engine</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">M</span>
      <div>
        <h1>MICHELIN CONVERGE</h1>
        <p>Agentic Lead-to-Dealer Engine</p>
      </div>
    </div>
    <div class="session-info" id="session-info">No session</div>
  </header>

  <main class="layout">
    <!-- LEFT: pipeline + lead list -->
    <section class="pipeline-panel">
      <h2>Today's Pipeline</h2>
      <div class="pipeline-stats" id="pipeline-stats">
        <div class="stat high"><span class="count" id="stat-high">0</span> High Priority</div>
        <div class="stat medium"><span class="count" id="stat-medium">0</span> Medium Priority</div>
        <div class="stat low"><span class="count" id="stat-low">0</span> Low Priority</div>
        <div class="stat review"><span class="count" id="stat-review">0</span> Human Review</div>
      </div>

      <h3>Leads</h3>
      <ul class="lead-list" id="lead-list"><!-- populated by script.js --></ul>

      <h3>Process a New Lead</h3>
      <textarea id="raw-lead-input" placeholder="Paste raw lead text here, e.g. 'Name: Rahul. Vehicle: Hyundai Creta. Needs highway tyres, budget 30k. Pune.'"></textarea>
      <button id="process-lead-btn">Run Agentic Pipeline</button>
    </section>

    <!-- CENTER: selected lead decision card -->
    <section class="decision-panel" id="decision-panel">
      <div class="empty-state">Select or process a lead to see the AI sales decision.</div>
    </section>

    <!-- RIGHT: trace + simulator -->
    <aside class="side-panel">
      <div class="panel-block">
        <h3>Agent Trace</h3>
        <div id="trace-view" class="trace-view"><p class="muted">No trace yet.</p></div>
      </div>
      <div class="panel-block">
        <h3>What-If Simulator</h3>
        <label>Budget (₹)<input type="number" id="sim-budget" /></label>
        <label>Requested discount (%)<input type="number" id="sim-discount" /></label>
        <button id="simulate-btn">Simulate</button>
        <div id="simulate-result" class="simulate-result"></div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
